<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1628">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MARINHA – Folheto</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── RESET & BASE ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --n: #0a1628;
  --s: #1a4a8a;
  --g: #c9a84c;
  --gl: #e8c97a;
  --bg: #f4f1ec;
  --mu: #7a8a9a;
  --r: #e74c3c;
  --gr: #27ae60;
}
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  font-family: 'DM Sans', sans-serif;
  color: #fff;
}

/* ── ECRÃ DE CARREGAMENTO ── */
#splash {
  position: fixed; inset: 0; z-index: 9999;
  background: linear-gradient(160deg, var(--n), var(--s));
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px;
}
.splashT { font-family: 'Playfair Display', serif; font-size: 42px; color: #f5f0e8; letter-spacing: 6px; }
.splashS { color: var(--g); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; }
.splashSpinner {
  width: 36px; height: 36px;
  border: 3px solid rgba(201,168,76,.3);
  border-top-color: var(--g);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#splash.hide { opacity: 0; transition: opacity .4s; pointer-events: none; }

/* ── VIEWER PRINCIPAL (fullscreen, uma imagem por ecrã) ── */
#viewer {
  position: fixed; inset: 0;
  background: #000;
  overflow: hidden;
  touch-action: pan-y;
}

/* Track horizontal de slides */
#track {
  display: flex;
  height: 100%;
  transition: transform .35s cubic-bezier(.4, 0, .2, 1);
  will-change: transform;
}

/* Cada slide = 100vw × 100vh */
.slide {
  flex-shrink: 0;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #000;
}

/* Imagem ocupa todo o ecrã sem cortes */
.slide img {
  width: 100vw;
  height: 100vh;
  object-fit: contain;
  object-position: center;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
}

/* ── HUD SUPERIOR ── */
#hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  padding: env(safe-area-inset-top, 12px) 16px 12px;
  background: linear-gradient(rgba(0,0,0,.65), transparent);
  display: flex; align-items: center; gap: 10px;
  transition: opacity .3s;
}
#hud.hide { opacity: 0; pointer-events: none; }
.hudLogo { font-family: 'Playfair Display', serif; font-size: 20px; color: #f5f0e8; letter-spacing: 3px; flex: 1; }
#hudCount { font-size: 13px; color: rgba(255,255,255,.65); font-weight: 600; }
.hudBtn {
  padding: 7px 14px;
  background: rgba(255,255,255,.15);
  border: none; color: #fff;
  border-radius: 8px; cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: 13px;
  backdrop-filter: blur(4px);
}

/* ── HUD INFERIOR ── */
#hudBot {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  padding: 12px 16px env(safe-area-inset-bottom, 12px);
  background: linear-gradient(transparent, rgba(0,0,0,.65));
  display: flex; align-items: center; justify-content: center; gap: 16px;
  transition: opacity .3s;
}
#hudBot.hide { opacity: 0; pointer-events: none; }
.navBtn {
  width: 48px; height: 48px;
  background: rgba(255,255,255,.15);
  border: none; color: #fff;
  border-radius: 50%; cursor: pointer;
  font-size: 22px; display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
  transition: background .15s, transform .1s;
}
.navBtn:active { background: rgba(255,255,255,.3); transform: scale(.92); }
.navBtn:disabled { opacity: .3; cursor: default; }

/* Indicadores de página (dots) */
#dots {
  display: flex; gap: 6px; align-items: center;
  max-width: calc(100vw - 140px);
  overflow: hidden;
}
.dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,.35);
  transition: background .2s, transform .2s;
  flex-shrink: 0;
}
.dot.a { background: var(--g); transform: scale(1.4); }

/* ── ECRÃ VAZIO ── */
#empty {
  display: none;
  position: fixed; inset: 0; z-index: 50;
  background: linear-gradient(160deg, var(--n), var(--s));
  flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  text-align: center; padding: 32px;
}
#empty.show { display: flex; }
.emptyIcon { font-size: 64px; }
.emptyT { font-family: 'Playfair Display', serif; font-size: 28px; color: #f5f0e8; letter-spacing: 4px; }
.emptyS { color: rgba(255,255,255,.55); font-size: 14px; line-height: 1.6; max-width: 280px; }

/* ── TOAST ── */
#toast {
  position: fixed; bottom: 80px; left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: rgba(10,22,40,.9);
  color: #fff; padding: 10px 20px;
  border-radius: 24px; font-size: 14px; font-weight: 600;
  z-index: 9999; opacity: 0; transition: .2s;
  pointer-events: none; white-space: nowrap;
  max-width: 90vw; text-align: center;
  backdrop-filter: blur(8px);
}
#toast.v { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- Splash de carregamento -->
<div id="splash">
  <div class="splashT">MARINHA</div>
  <div class="splashS">A carregar folheto...</div>
  <div class="splashSpinner"></div>
</div>

<!-- Viewer fullscreen -->
<div id="viewer">
  <div id="track"></div>
</div>

<!-- HUD superior -->
<div id="hud">
  <div class="hudLogo" id="hudLogo">MARINHA</div>
  <span id="hudCount"></span>
  <button class="hudBtn" onclick="toggleHud()">⊞</button>
</div>

<!-- HUD inferior -->
<div id="hudBot">
  <button class="navBtn" id="btnPrev" onclick="navTo(_idx - 1)">‹</button>
  <div id="dots"></div>
  <button class="navBtn" id="btnNext" onclick="navTo(_idx + 1)">›</button>
</div>

<!-- Ecrã vazio -->
<div id="empty">
  <div class="emptyIcon">📄</div>
  <div class="emptyT">MARINHA</div>
  <div class="emptyS">O folheto ainda não tem páginas.<br>Aceda ao painel de administração para adicionar imagens.</div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════
//  SUPABASE CONFIG
// ══════════════════════════════════════════
var SB = 'https://opzmuzogxfzeqwjxmfvc.supabase.co';
var SK = 'sb_publishable_e_Bd_rx2rfzBeIrbyGxCwA_SfXklv4s';

async function sbGet(t, q) {
  try {
    var r = await fetch(SB + '/rest/v1/' + t + '?select=*' + (q ? '&' + q : ''), {
      headers: { 'apikey': SK, 'Authorization': 'Bearer ' + SK }
    });
    return r.ok ? r.json() : [];
  } catch(e) { return []; }
}

// ══════════════════════════════════════════
//  ESTADO
// ══════════════════════════════════════════
var _slides = [];   // array de { url, nome }
var _idx = 0;
var _hudVisible = true;
var _hudTimer = null;
var _touchX = 0, _touchY = 0;

// ══════════════════════════════════════════
//  INICIALIZAÇÃO
// ══════════════════════════════════════════
async function init() {
  try {
    // Carregar config (nome da loja)
    var cfgs = await sbGet('config');
    if (cfgs && cfgs.length) {
      var nome = cfgs[0].nome_loja || 'MARINHA';
      document.getElementById('hudLogo').textContent = nome;
      document.title = nome + ' – Folheto';
    }

    // Carregar folheto do Supabase
    var fols = await sbGet('folhetos', 'order=adicionado.asc');
    if (!fols || !fols.length) {
      esconderSplash();
      document.getElementById('empty').classList.add('show');
      return;
    }

    // Aceitar tanto campo "url" (novo) como "data" (base64 antigo)
    _slides = fols
      .map(function(f) { return { url: f.url || f.data || '', nome: f.nome || '' }; })
      .filter(function(s) { return s.url; });

    if (!_slides.length) {
      esconderSplash();
      document.getElementById('empty').classList.add('show');
      return;
    }

    construirSlides();
    navTo(0, true);
    esconderSplash();
    autoEsconderHud();
  } catch(e) {
    console.error(e);
    esconderSplash();
    document.getElementById('empty').classList.add('show');
  }
}

function esconderSplash() {
  var s = document.getElementById('splash');
  s.classList.add('hide');
  setTimeout(function() { s.style.display = 'none'; }, 450);
}

// ══════════════════════════════════════════
//  CONSTRUIR SLIDES
// ══════════════════════════════════════════
function construirSlides() {
  var track = document.getElementById('track');
  // Largura total do track = nº slides × 100vw
  track.style.width = (_slides.length * 100) + 'vw';
  track.innerHTML = _slides.map(function(s, i) {
    return '<div class="slide" id="slide' + i + '">' +
      '<img src="' + s.url + '" alt="Página ' + (i + 1) + '" loading="' + (i === 0 ? 'eager' : 'lazy') + '" draggable="false">' +
      '</div>';
  }).join('');

  // Construir dots indicadores
  var dotsEl = document.getElementById('dots');
  // Mostrar no máximo 15 dots para não transbordar
  var maxDots = Math.min(_slides.length, 15);
  dotsEl.innerHTML = Array.from({ length: maxDots }, function(_, i) {
    return '<div class="dot" id="dot' + i + '"></div>';
  }).join('');
}

// ══════════════════════════════════════════
//  NAVEGAÇÃO
// ══════════════════════════════════════════
function navTo(i, instant) {
  if (!_slides.length) return;
  _idx = Math.max(0, Math.min(_slides.length - 1, i));

  var track = document.getElementById('track');
  if (instant) {
    track.style.transition = 'none';
    track.style.transform = 'translateX(-' + (_idx * 100) + 'vw)';
    // Forçar reflow para aplicar sem transição
    track.offsetHeight;
    track.style.transition = '';
  } else {
    track.style.transform = 'translateX(-' + (_idx * 100) + 'vw)';
  }

  // Atualizar contador
  document.getElementById('hudCount').textContent = (_idx + 1) + ' / ' + _slides.length;

  // Atualizar dots
  var maxDots = Math.min(_slides.length, 15);
  for (var d = 0; d < maxDots; d++) {
    var dot = document.getElementById('dot' + d);
    if (dot) dot.classList.toggle('a', d === _idx);
  }

  // Atualizar botões
  document.getElementById('btnPrev').disabled = _idx === 0;
  document.getElementById('btnNext').disabled = _idx === _slides.length - 1;

  autoEsconderHud();
}

// ══════════════════════════════════════════
//  HUD — mostrar/esconder automaticamente
// ══════════════════════════════════════════
function mostrarHud() {
  document.getElementById('hud').classList.remove('hide');
  document.getElementById('hudBot').classList.remove('hide');
  _hudVisible = true;
  autoEsconderHud();
}

function esconderHud() {
  document.getElementById('hud').classList.add('hide');
  document.getElementById('hudBot').classList.add('hide');
  _hudVisible = false;
}

function toggleHud() {
  if (_hudVisible) esconderHud();
  else mostrarHud();
}

function autoEsconderHud() {
  clearTimeout(_hudTimer);
  _hudTimer = setTimeout(function() {
    if (_slides.length > 1) esconderHud();
  }, 4000);
}

// ══════════════════════════════════════════
//  TOUCH / SWIPE
// ══════════════════════════════════════════
var viewer = document.getElementById('viewer');

viewer.addEventListener('touchstart', function(e) {
  _touchX = e.touches[0].clientX;
  _touchY = e.touches[0].clientY;
  mostrarHud();
}, { passive: true });

viewer.addEventListener('touchend', function(e) {
  var dx = e.changedTouches[0].clientX - _touchX;
  var dy = e.changedTouches[0].clientY - _touchY;
  // Swipe horizontal (ignorar se for mais vertical)
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
    navTo(_idx + (dx < 0 ? 1 : -1));
  }
}, { passive: true });

// Tap para mostrar HUD
viewer.addEventListener('click', function() {
  mostrarHud();
});

// ══════════════════════════════════════════
//  TECLADO
// ══════════════════════════════════════════
document.addEventListener('keydown', function(e) {
  mostrarHud();
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); navTo(_idx + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); navTo(_idx - 1); }
  if (e.key === 'Home') navTo(0);
  if (e.key === 'End') navTo(_slides.length - 1);
});

// ══════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════
var _toastT = null;
function toast(msg, dur) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('v');
  clearTimeout(_toastT);
  _toastT = setTimeout(function() { el.classList.remove('v'); }, dur || 2500);
}

// ══════════════════════════════════════════
//  ARRANCAR
// ══════════════════════════════════════════
init();
</script>
</body>
</html>
