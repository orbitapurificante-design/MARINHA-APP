<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>MARINHA – Fidelização</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
        :root{--n:#0a1628;--s:#1a4a8a;--g:#c9a84c;--gl:#e8c97a;--bg:#f4f1ec;--mu:#7a8a9a;--r:#e74c3c;--gr:#27ae60}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--n);min-height:100vh}

        /* LOGIN */
        #eReg{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,var(--n),var(--s));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:14px}
        .rInp{width:100%;max-width:320px;padding:16px;background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.2);border-radius:14px;color:#fff;text-align:center;font-size:16px;outline:none;font-family:'DM Sans',sans-serif}
        .rInp::placeholder{color:rgba(255,255,255,0.4)}
        .rBtn{width:100%;max-width:320px;padding:16px;background:linear-gradient(135deg,var(--g),var(--gl));color:var(--n);border:none;border-radius:14px;font-weight:800;cursor:pointer;font-size:16px;font-family:'DM Sans',sans-serif}

        /* APP */
        #eApp{display:none;flex-direction:column;min-height:100vh}
        #eApp.v{display:flex}
        .cab{position:fixed;top:0;left:0;right:0;z-index:100;height:60px;background:linear-gradient(135deg,var(--n),var(--s));display:flex;align-items:center;padding:0 16px;box-shadow:0 3px 16px rgba(0,0,0,.25)}
        .cabT{color:#fff;font-size:17px;font-weight:700;flex:1}

        /* NAV — igual ao admin */
        .nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:#fff;border-top:1px solid rgba(0,0,0,.07);display:flex;height:68px}
        .nBtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;cursor:pointer;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mu);font-family:'DM Sans',sans-serif}
        .nBtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
        .nBtn.a{color:var(--n)}
        .nBtn.a svg{stroke:var(--g)}

        /* ECRAS */
        .ecra{display:none;padding:72px 0 80px;min-height:100vh}.ecra.a{display:block}
        .s{padding:0 16px}

        /* HERO */
        .hero{background:linear-gradient(135deg,var(--n),var(--s));border-radius:20px;padding:22px;color:#fff;margin-bottom:16px}
        .hGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
        .hItem{background:rgba(255,255,255,0.1);padding:14px;border-radius:14px}
        .hVal{font-size:22px;font-weight:800}
        .hLbl{font-size:10px;opacity:0.6;font-weight:700;margin-top:2px;text-transform:uppercase;letter-spacing:0.5px}

        /* PROMOS — estilo admin */
        .section-title{font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;display:block}
        .pGrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
        .pCard{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(10,22,40,.07)}
        .pImgW{width:100%;padding-bottom:100%;background:#eef2f7;position:relative;overflow:hidden}
        .pImgW img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}
        .pImgW .pEmoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px}
        .pBdg{position:absolute;top:6px;left:6px;background:var(--r);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;z-index:1}
        .pBody{padding:10px}
        .pNome{font-size:13px;font-weight:700;margin-bottom:4px;line-height:1.2}
        .precos{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
        .pOrig{font-size:11px;color:var(--mu);text-decoration:line-through}
        .pNovo{font-size:15px;font-weight:800;color:var(--r)}
        .pData{font-size:10px;color:var(--mu);margin-top:3px}

        /* FOLHETOS */
        .fImg{width:100%;border-radius:14px;margin-bottom:12px;box-shadow:0 4px 16px rgba(0,0,0,.1);display:block}

        /* QR */
        .qrHero{background:linear-gradient(135deg,var(--n),var(--s));border-radius:20px;padding:32px 20px;color:#fff;text-align:center}

        /* TOAST */
        #toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--n);color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;font-weight:600;z-index:9999;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
        #toast.v{opacity:1;transform:translateX(-50%) translateY(0)}
    </style>
</head>
<body>

<div id="eReg">
    <h1 style="color:#fff;letter-spacing:4px;font-size:32px">MARINHA</h1>
    <p style="color:var(--gl);font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px">Cliente VIP</p>
    <input class="rInp" id="rNome" type="text" placeholder="Nome Completo" autocomplete="name">
    <input class="rInp" id="rTel" type="tel" placeholder="Nº Telemóvel" autocomplete="tel">
    <button class="rBtn" id="btnEntrar" onclick="registar()">ACEDER AO CARTÃO</button>
    <p style="color:rgba(255,255,255,.35);font-size:12px;text-align:center;max-width:280px;line-height:1.5">O seu cartão fica guardado neste dispositivo.</p>
</div>

<div id="eApp">
    <div class="cab">
        <div class="cabT" id="cabNome">MARINHA</div>
    </div>

    <!-- INÍCIO -->
    <div class="ecra a" id="ecraInicio">
        <div class="s">
            <div style="height:10px"></div>
            <div class="hero">
                <p style="opacity:0.6;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:1px">Bem-vindo</p>
                <h2 id="hNome" style="font-size:26px;font-weight:800;margin-top:2px">...</h2>
                <div class="hGrid">
                    <div class="hItem">
                        <div class="hVal" id="hPts">0</div>
                        <div class="hLbl">Pontos</div>
                    </div>
                    <div class="hItem">
                        <div class="hVal" id="hPou">0.00€</div>
                        <div class="hLbl">Total Poupado</div>
                    </div>
                </div>
                <p id="hNum" style="margin-top:14px;font-size:11px;opacity:0.45;text-align:right;letter-spacing:1px"></p>
            </div>
            <span class="section-title">Promoções em Destaque</span>
            <div id="listPromos"></div>
        </div>
    </div>

    <!-- FOLHETOS -->
    <div class="ecra" id="ecraFolhetos">
        <div class="s">
            <div style="height:10px"></div>
            <span class="section-title">Folhetos da Semana</span>
            <div id="listFolhetos"></div>
        </div>
    </div>

    <!-- CARTÃO QR -->
    <div class="ecra" id="ecraQR">
        <div class="s">
            <div style="height:10px"></div>
            <div class="qrHero">
                <p style="font-size:11px;opacity:0.5;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">O seu cartão digital</p>
                <div style="background:#fff;padding:14px;display:inline-block;border-radius:16px;margin:16px 0">
                    <svg id="qrSvg" width="160" height="160" viewBox="0 0 160 160"></svg>
                </div>
                <h3 id="qrNome" style="font-weight:800;font-size:18px;text-transform:uppercase;margin-bottom:4px"></h3>
                <p id="qrNum" style="opacity:0.5;font-size:13px"></p>
            </div>
        </div>
    </div>

    <!-- NAV com SVG icons — igual ao admin -->
    <nav class="nav">
        <button class="nBtn a" id="nInicio" onclick="ir('Inicio')">
            <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Início
        </button>
        <button class="nBtn" id="nFolhetos" onclick="ir('Folhetos')">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Folhetos
        </button>
        <button class="nBtn" id="nQR" onclick="ir('QR')">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="5" height="5"/><rect x="16" y="3" width="5" height="5"/><rect x="3" y="16" width="5" height="5"/><path d="M21 16h-3a2 2 0 0 0-2 2v3M21 21v.01M12 7v3a2 2 0 0 1-2 2H7"/></svg>
            Cartão
        </button>
        <button class="nBtn" onclick="sair()">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sair
        </button>
    </nav>
</div>

<div id="toast"></div>

<script>
const SB = 'https://opzmuzogxfzeqwjxmfvc.supabase.co';
const SK = 'sb_publishable_e_Bd_rx2rfzBeIrbyGxCwA_SfXklv4s';
let USER = null;

function hd(){ return { 'apikey': SK, 'Authorization': 'Bearer ' + SK, 'Content-Type': 'application/json' }; }

function toast(m, ms) {
    var t = document.getElementById('toast');
    t.textContent = m; t.classList.add('v');
    clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('v'); }, ms || 2500);
}

function hoje(){ return new Date().toISOString().slice(0,10); }
function fd(d){ return d ? new Date(d).toLocaleDateString('pt-PT',{day:'2-digit',month:'short'}) : ''; }

async function api(table) {
    try {
        const r = await fetch(SB + '/rest/v1/' + table, { headers: hd() });
        return r.ok ? await r.json() : [];
    } catch(e) { return []; }
}

async function registar() {
    const n = document.getElementById('rNome').value.trim();
    const t = document.getElementById('rTel').value.trim().replace(/\s/g,'');
    const btn = document.getElementById('btnEntrar');
    if(!n || t.length < 9) { toast('⚠️ Preencha nome e telemóvel'); return; }
    btn.textContent = 'A carregar...'; btn.disabled = true;
    let res = await api('clientes?tel=eq.' + t);
    if(res && res.length > 0) {
        USER = res[0];
    } else {
        const num = (Math.floor(10000 + Math.random() * 89999)).toString();
        USER = { id: Date.now().toString(36), nome: n, tel: t, pts: 0, poupado: 0, num_cliente: num, visitas: 0, historico: [], desde: hoje() };
        await fetch(SB + '/rest/v1/clientes', {
            method: 'POST',
            headers: Object.assign({}, hd(), { 'Prefer': 'return=representation' }),
            body: JSON.stringify(USER)
        });
    }
    localStorage.setItem('m_tel', t);
    entrar();
}

function entrar() {
    document.getElementById('eReg').style.display = 'none';
    document.getElementById('eApp').classList.add('v');
    document.getElementById('eApp').style.display = 'flex';
    ir('Inicio');
}

function ir(tab) {
    document.querySelectorAll('.ecra').forEach(function(el){ el.classList.remove('a'); });
    document.querySelectorAll('.nBtn').forEach(function(el){ el.classList.remove('a'); });
    var ecra = document.getElementById('ecra' + tab);
    var btn = document.getElementById('n' + tab);
    if(ecra) ecra.classList.add('a');
    if(btn) btn.classList.add('a');
    if(tab === 'Inicio') renderInicio();
    if(tab === 'Folhetos') renderFolhetos();
    if(tab === 'QR') renderQR();
    window.scrollTo(0, 0);
}

async function renderInicio() {
    if(!USER) return;
    document.getElementById('hNome').textContent = USER.nome;
    document.getElementById('hNum').textContent = 'Nº ' + (USER.num_cliente || '—');
    document.getElementById('hPts').textContent = USER.pts || 0;
    document.getElementById('hPou').textContent = parseFloat(USER.poupado || 0).toFixed(2) + '€';
    document.getElementById('cabNome').textContent = USER.nome.split(' ')[0];

    const h = hoje();
    const promos = await api('promos?order=id.desc');
    // Filtrar activas (sem datas = sempre activa)
    const activas = promos.filter(function(p){
        var ok1 = !p.data_ini || p.data_ini === '' || p.data_ini <= h;
        var ok2 = !p.data_fim || p.data_fim === '' || p.data_fim >= h;
        return ok1 && ok2;
    });

    const list = document.getElementById('listPromos');
    if(!activas.length) {
        list.innerHTML = '<p style="color:var(--mu);text-align:center;padding:20px">Nenhuma promoção ativa.</p>';
        return;
    }
    list.innerHTML = '<div class="pGrid2">' + activas.map(function(p) {
        // campos: nome, foto, emoji, preco_orig, preco_novo, data_ini, data_fim
        var po = parseFloat(p.preco_orig) || 0;
        var pn = parseFloat(p.preco_novo) || 0;
        var pct = (po > 0 && pn > 0) ? Math.round((1 - pn/po) * 100) : 0;
        var fotoSrc = (p.foto && (p.foto.startsWith('http') || p.foto.startsWith('data:'))) ? p.foto : '';
        var imgHtml = fotoSrc
            ? '<img src="' + fotoSrc + '" onerror="this.style.display=\'none\'">'
            : '<div class="pEmoji">' + (p.emoji || '🛒') + '</div>';
        var dataFimHtml = p.data_fim ? '<div class="pData">Válido até ' + fd(p.data_fim) + '</div>' : '';
        return '<div class="pCard">' +
            '<div class="pImgW">' +
                imgHtml +
                (pct > 0 ? '<div class="pBdg">-' + pct + '%</div>' : '') +
            '</div>' +
            '<div class="pBody">' +
                '<div class="pNome">' + p.nome + '</div>' +
                '<div class="precos">' +
                    (pn > 0 ? '<span class="pNovo">' + pn.toFixed(2) + '€</span>' : '') +
                    (po > 0 ? '<span class="pOrig">' + po.toFixed(2) + '€</span>' : '') +
                '</div>' +
                dataFimHtml +
            '</div>' +
        '</div>';
    }).join('') + '</div>';
}

async function renderFolhetos() {
    const folhetos = await api('folhetos?order=id.desc');
    const list = document.getElementById('listFolhetos');
    const validos = folhetos.filter(function(f){ return f.data && f.data.length > 10; });
    if(!validos.length) {
        list.innerHTML = '<p style="color:var(--mu);text-align:center;padding:20px">Sem folhetos de momento.</p>';
        return;
    }
    list.innerHTML = validos.map(function(f){
        return '<img src="' + f.data + '" class="fImg" loading="lazy" onerror="this.style.display=\'none\'">';
    }).join('');
}

function renderQR() {
    if(!USER) return;
    document.getElementById('qrNome').textContent = USER.nome;
    document.getElementById('qrNum').textContent = 'Nº CLIENTE: ' + (USER.num_cliente || '—');
    // Gerar QR simples
    var svg = document.getElementById('qrSvg');
    svg.innerHTML = '';
    var txt = 'MARINHA:' + (USER.id || USER.tel);
    var size = 160; var cells = 21; var cell = size / cells;
    // Pattern baseado no texto
    var seed = 0; for(var i=0;i<txt.length;i++) seed = (seed*31 + txt.charCodeAt(i)) & 0xFFFFFF;
    var rand = function(){ seed=(seed*1664525+1013904223)&0xFFFFFF; return seed/0xFFFFFF; };
    var bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
    bg.setAttribute('width',size); bg.setAttribute('height',size); bg.setAttribute('fill','#fff');
    svg.appendChild(bg);
    for(var r=0;r<cells;r++) for(var c=0;c<cells;c++) {
        // Finder patterns nos cantos
        var isFinder = (r<7&&c<7)||(r<7&&c>=cells-7)||(r>=cells-7&&c<7);
        var isFinderBorder = (r===7||c===7||r===cells-8||c===cells-8) && !isFinder;
        var filled = false;
        if(isFinder){ var dr=r<7?r:r-(cells-7), dc=c<7?c:c-(cells-7); filled=(dr===0||dr===6||dc===0||dc===6||(dr>=2&&dr<=4&&dc>=2&&dc<=4)); }
        else if(!isFinderBorder){ filled = rand() > 0.5; }
        if(filled){ var rect=document.createElementNS('http://www.w3.org/2000/svg','rect'); rect.setAttribute('x',c*cell); rect.setAttribute('y',r*cell); rect.setAttribute('width',cell-0.5); rect.setAttribute('height',cell-0.5); rect.setAttribute('fill','#0a1628'); svg.appendChild(rect); }
    }
}

function sair() {
    if(!confirm('Sair da conta?')) return;
    localStorage.clear();
    location.reload();
}

window.onload = async function() {
    const t = localStorage.getItem('m_tel');
    if(t) {
        let res = await api('clientes?tel=eq.' + t);
        if(res && res[0]) { USER = res[0]; entrar(); return; }
    }
};
</script>
</body>
</html>
