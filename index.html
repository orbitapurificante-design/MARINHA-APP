<button onclick="openPromoModal()" class="btn-menu">PROMOÇÕES</button>
<button onclick="openFolhetoModal()" class="btn-menu">FOLHETO</button>

<div class="modal fade" id="promoModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-body text-center p-4">
    <h4 class="fw-bold mb-3">Promoções</h4>
    <p id="modal-promo-text" class="fs-5"></p>
    <button class="btn btn-dark w-100" data-bs-dismiss="modal">Fechar</button>
</div></div></div></div>

<div class="modal fade" id="folhetoModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content"><div class="modal-body p-4">
    <h4 class="fw-bold text-center mb-1">Folheto de Produtos</h4>
    <p id="modal-folheto-data" class="text-center text-muted mb-4 small"></p>
    <div id="modal-folheto-fotos"></div>
    <button class="btn btn-dark w-100 mt-3" data-bs-dismiss="modal">Fechar</button>
</div></div></div></div>

<script>
    // Coloque estas funções no seu script principal do INDEX
    async function openPromoModal() {
        const { data } = await supabase.from('promos').select('promo_text').eq('id', 1).single();
        document.getElementById('modal-promo-text').innerText = data ? data.promo_text : "Sem promoções de momento.";
        new bootstrap.Modal(document.getElementById('promoModal')).show();
    }

    async function openFolhetoModal() {
        const { data: d } = await supabase.from('datas_folheto').select('*').eq('id', 1).single();
        const { data: f } = await supabase.from('folhetos').select('*').order('created_at', {ascending:false});
        
        document.getElementById('modal-folheto-data').innerText = d ? `Válido de ${d.data_inicio} a ${d.data_fim}` : "";
        const divFotos = document.getElementById('modal-folheto-fotos');
        divFotos.innerHTML = f && f.length > 0 ? f.map(img => `<img src="${img.url}" class="w-100 rounded mb-3 shadow-sm">`).join('') : "<p class='text-center'>Folheto brevemente disponível.</p>";
        
        new bootstrap.Modal(document.getElementById('folhetoModal')).show();
    }
</script>
