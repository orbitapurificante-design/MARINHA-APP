<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Marinha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f1ec; padding: 20px; font-family: sans-serif; }
        .card-custom { background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .img-preview { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; margin: 5px; border: 1px solid #ddd; }
        .photo-item { position: relative; display: inline-block; }
        .btn-del { position: absolute; top: -5px; right: -5px; background: #ff4444; color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="container" style="max-width: 500px;">
    <h3 class="text-center mb-4 fw-bold">Gestão Marinha</h3>

    <div class="card-custom">
        <label class="fw-bold mb-2">PROMOÇÃO (TEXTO)</label>
        <textarea id="promoInput" class="form-control mb-2" rows="2" placeholder="Texto da barra superior..."></textarea>
        <button onclick="savePromo()" class="btn btn-dark w-100 fw-bold">GUARDAR TEXTO PROMO</button>
    </div>

    <div class="card-custom">
        <label class="fw-bold mb-2">FOLHETO (DATAS)</label>
        <div class="d-flex gap-2 mb-2">
            <input type="text" id="dataIni" class="form-control" placeholder="Início (Ex: 01 Abr)">
            <input type="text" id="dataFim" class="form-control" placeholder="Fim (Ex: 15 Abr)">
        </div>
        <button onclick="saveDates()" class="btn btn-success w-100 fw-bold">GUARDAR DATAS FOLHETO</button>
    </div>

    <div class="card-custom">
        <label class="fw-bold mb-2">FOLHETO (FOTOS)</label>
        <input type="file" id="fileInput" class="form-control mb-2" accept="image/*">
        <button id="upBtn" onclick="uploadImg()" class="btn btn-primary w-100 fw-bold mb-3">SUBIR FOTO AO FOLHETO</button>
        <label class="small fw-bold text-muted">FOTOS NO FOLHETO ATUAL (Clique no X para apagar):</label>
        <div id="galeria" class="d-flex flex-wrap mt-2"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const URL = 'https://opzmuzogxfzeqwjxmfvc.supabase.co';
    const KEY = 'sb_publishable_e_Bd_rx2rfzBeIrbyGxCwA_SfXklv4s';
    const supabase = window.supabase.createClient(URL, KEY);

    window.onload = loadAll;

    async function loadAll() {
        const { data: p } = await supabase.from('promos').select('*').eq('id', 1).single();
        if(p) document.getElementById('promoInput').value = p.promo_text;
        const { data: d } = await supabase.from('datas_folheto').select('*').eq('id', 1).single();
        if(d) { document.getElementById('dataIni').value = d.data_inicio; document.getElementById('dataFim').value = d.data_fim; }
        const { data: f } = await supabase.from('folhetos').select('*').order('created_at', {ascending:false});
        const div = document.getElementById('galeria');
        div.innerHTML = '';
        if(f) f.forEach(img => {
            div.innerHTML += `<div class="photo-item"><img src="${img.url}" class="img-preview"><button class="btn-del" onclick="delImg(${img.id})">X</button></div>`;
        });
    }

    async function savePromo() {
        await supabase.from('promos').upsert({ id: 1, promo_text: document.getElementById('promoInput').value });
        alert("Promoção atualizada!");
    }

    async function saveDates() {
        await supabase.from('datas_folheto').upsert({ id: 1, data_inicio: document.getElementById('dataIni').value, data_fim: document.getElementById('dataFim').value });
        alert("Datas atualizadas!");
    }

    async function uploadImg() {
        const file = document.getElementById('fileInput').files[0];
        if(!file) return alert("Selecione uma foto primeiro.");
        document.getElementById('upBtn').innerText = "A ENVIAR...";
        const name = `f_${Date.now()}.${file.name.split('.').pop()}`;
        await supabase.storage.from('folhetos').upload(name, file);
        const { data } = supabase.storage.from('folhetos').getPublicUrl(name);
        await supabase.from('folhetos').insert({ url: data.publicUrl });
        document.getElementById('upBtn').innerText = "SUBIR FOTO AO FOLHETO";
        loadAll();
    }

    async function delImg(id) {
        if(confirm("Apagar esta foto do folheto?")) {
            await supabase.from('folhetos').delete().eq('id', id);
            loadAll();
        }
    }
</script>
</body>
</html>
