<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Marinha - Gestão Total</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #f4f1ec; font-family: sans-serif; padding: 20px; }
        .card-custom { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .img-preview { width: 100px; height: 100px; object-fit: cover; border-radius: 10px; margin: 5px; border: 2px solid #eee; }
        .photo-item { position: relative; display: inline-block; }
        .btn-delete { position: absolute; top: -5px; right: -5px; padding: 2px 6px; border-radius: 50%; }
    </style>
</head>
<body>

<div class="container" style="max-width: 800px;">
    <h2 class="text-center mb-4">Painel de Gestão Marinha</h2>

    <div class="card-custom">
        <h5 class="text-primary"><i class="bi bi-megaphone"></i> Promoção de Topo</h5>
        <textarea id="promoInput" class="form-control mb-3" rows="2" placeholder="Texto da promoção..."></textarea>
        <button onclick="savePromo()" class="btn btn-primary w-100">Atualizar Texto</button>
    </div>

    <div class="card-custom">
        <h5 class="text-success"><i class="bi bi-journal-richtext"></i> Folheto de Produtos</h5>
        
        <div class="row g-2 mb-3">
            <div class="col-6">
                <label class="small fw-bold">Início</label>
                <input type="text" id="dataInicio" class="form-control" placeholder="Ex: 01 Abr">
            </div>
            <div class="col-6">
                <label class="small fw-bold">Fim</label>
                <input type="text" id="dataFim" class="form-control" placeholder="Ex: 15 Abr">
            </div>
        </div>
        <button onclick="saveDatas()" class="btn btn-success btn-sm w-100 mb-4">Atualizar Datas do Folheto</button>

        <label class="fw-bold mb-2">Adicionar Foto ao Folheto</label>
        <input type="file" id="fileInput" class="form-control mb-3" accept="image/*">
        <button id="btnUpload" onclick="uploadFoto()" class="btn btn-dark w-100">Subir Nova Foto</button>

        <hr>
        <label class="fw-bold mb-3">Fotos Atuais (Clique no X para apagar)</label>
        <div id="galeriaAdmin" class="d-flex flex-wrap"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const URL = 'https://opzmuzogxfzeqwjxmfvc.supabase.co';
    const KEY = 'sb_publishable_e_Bd_rx2rfzBeIrbyGxCwA_SfXklv4s';
    const supabase = window.supabase.createClient(URL, KEY);

    // CARREGAR DADOS AO ABRIR
    window.onload = () => { loadPromo(); loadDatas(); loadGaleria(); };

    async function loadPromo() {
        const { data } = await supabase.from('promos').select('*').eq('id', 1).single();
        if (data) document.getElementById('promoInput').value = data.promo_text;
    }

    async function loadDatas() {
        const { data } = await supabase.from('datas_folheto').select('*').eq('id', 1).single();
        if (data) {
            document.getElementById('dataInicio').value = data.data_inicio;
            document.getElementById('dataFim').value = data.data_fim;
        }
    }

    async function loadGaleria() {
        const { data } = await supabase.from('folhetos').select('*').order('created_at', { ascending: false });
        const container = document.getElementById('galeriaAdmin');
        container.innerHTML = '';
        data.forEach(item => {
            container.innerHTML += `
                <div class="photo-item">
                    <img src="${item.url}" class="img-preview">
                    <button onclick="deleteFoto(${item.id})" class="btn btn-danger btn-delete btn-sm">X</button>
                </div>`;
        });
    }

    async function savePromo() {
        const txt = document.getElementById('promoInput').value;
        await supabase.from('promos').upsert({ id: 1, promo_text: txt });
        alert("Texto atualizado!");
    }

    async function saveDatas() {
        const ini = document.getElementById('dataInicio').value;
        const fim = document.getElementById('dataFim').value;
        await supabase.from('datas_folheto').upsert({ id: 1, data_inicio: ini, data_fim: fim });
        alert("Datas atualizadas!");
    }

    async function uploadFoto() {
        const file = document.getElementById('fileInput').files[0];
        if(!file) return alert("Selecione uma foto!");
        
        document.getElementById('btnUpload').innerText = "A subir...";
        const name = `f_${Date.now()}.${file.name.split('.').pop()}`;
        await supabase.storage.from('folhetos').upload(name, file);
        const { data } = supabase.storage.from('folhetos').getPublicUrl(name);
        
        await supabase.from('folhetos').insert({ url: data.publicUrl });
        document.getElementById('btnUpload').innerText = "Subir Nova Foto";
        loadGaleria();
    }

    async function deleteFoto(id) {
        if(confirm("Apagar esta foto?")) {
            await supabase.from('folhetos').delete().eq('id', id);
            loadGaleria();
        }
    }
</script>
</body>
</html>
